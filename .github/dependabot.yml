version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "gradle"
    groups:
      android-and-kotlin:
        patterns:
          - "com.android.application"
          - "com.android.library"
          - "com.android.tools.build*"
          - "org.jetbrains.kotlin*"
          - "androidx.compose*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
